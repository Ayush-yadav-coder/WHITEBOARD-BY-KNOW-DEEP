<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 600" width="100%" height="100%">
  <defs>
    <linearGradient id="menuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#197d91" />
      <stop offset="50%" stop-color="#146f82" />
      <stop offset="100%" stop-color="#0f5c6d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Drawer Shell (Samsung WAF Interactive Display rounded pill) -->
  <rect x="10" y="10" width="220" height="580" rx="36" fill="url(#menuBg)" filter="url(#shadow)" stroke="#2299b0" stroke-width="2" />

  <!-- Menu Item Rows -->
  <!-- 1. + New -->
  <g transform="translate(30, 45)">
    <path d="M 12 4 L 12 20 M 4 12 L 20 12" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New</text>
  </g>

  <!-- 2. Open -->
  <g transform="translate(30, 105)">
    <path d="M 4 8 L 10 8 L 12 11 L 20 11 A 2 2 0 0 1 22 13 L 22 19 A 2 2 0 0 1 20 21 L 4 21 A 2 2 0 0 1 2 19 L 2 10 A 2 2 0 0 1 4 8 Z" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linejoin="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Open</text>
  </g>

  <!-- 3. Save -->
  <g transform="translate(30, 165)">
    <path d="M 4 16 L 4 20 L 20 20 L 20 16 M 12 4 L 12 15 M 8 11 L 12 15 L 16 11" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Save</text>
  </g>

  <!-- 4. Save as -->
  <g transform="translate(30, 225)">
    <rect x="3" y="5" width="18" height="15" rx="2" fill="none" stroke="#38bdf8" stroke-width="2.2" />
    <line x1="8" y1="12" x2="16" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Save as</text>
  </g>

  <!-- 5. Upload -->
  <g transform="translate(30, 285)">
    <path d="M 5 17 A 4 4 0 0 1 6 9 A 6 6 0 0 1 17 8 A 4 4 0 0 1 20 15 L 20 17" fill="none" stroke="#67e8f9" stroke-width="2.2" />
    <path d="M 12 19 L 12 12 M 9 15 L 12 12 L 15 15" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Upload</text>
  </g>

  <!-- 6. QR code -->
  <g transform="translate(30, 345)">
    <path d="M 3 8 L 3 3 L 8 3 M 16 3 L 21 3 L 21 8 M 21 16 L 21 21 L 16 21 M 8 21 L 3 21 L 3 16" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="12" cy="12" r="3" fill="#818cf8" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">QR code</text>
  </g>

  <!-- 7. Email -->
  <g transform="translate(30, 405)">
    <rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="#fb7185" stroke-width="2.2" />
    <path d="M 3 8 L 12 14 L 21 8" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Email</text>
  </g>

  <!-- 8. Settings -->
  <g transform="translate(30, 465)">
    <circle cx="12" cy="12" r="3.5" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 12 2 L 12 5 M 12 19 L 12 22 M 2 12 L 5 12 M 19 12 L 22 12 M 5 5 L 7 7 M 17 17 L 19 19 M 5 19 L 7 17 M 17 7 L 19 5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Settings</text>
  </g>

  <!-- 9. Exit -->
  <g transform="translate(30, 525)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 9 12 L 15 12 M 12 9 L 15 12 L 12 15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Exit</text>
  </g>
</svg>
