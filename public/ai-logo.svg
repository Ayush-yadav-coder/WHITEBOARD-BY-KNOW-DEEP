<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="70%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Ring Multi-color Gradients -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#8b5cf6" />
      <stop offset="65%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerRingGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" />

  <!-- Outer Rounded Squircle Glowing Border (matching WhatsApp Image 2026-09-04 at 4.17.11 PM) -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95" />

  <!-- Tech equalizer vertical bars / circuit traces in the dark space -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.2">
    <line x1="45" y1="70" x2="45" y2="130" stroke-dasharray="2 4" />
    <line x1="55" y1="60" x2="55" y2="140" stroke-dasharray="3 3" />
    <line x1="145" y1="60" x2="145" y2="140" stroke-dasharray="3 3" />
    <line x1="155" y1="70" x2="155" y2="130" stroke-dasharray="2 4" />
    <circle cx="45" cy="130" r="1.5" fill="#38bdf8" />
    <circle cx="155" cy="70" r="1.5" fill="#ec4899" />
  </g>

  <!-- Outer Ambient Glow Circle -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#ringGrad1)" stroke-width="8" opacity="0.4" filter="url(#outerRingGlow)" />

  <!-- Interwoven Fiber-Optic Waves (Wave Strand 1 - Cyan to Violet to Pink) -->
  <path d="M 40 100 A 60 60 0 1 0 160 100 A 60 60 0 1 0 40 100"
        fill="none" stroke="url(#ringGrad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Interwoven Fiber-Optic Ribbon (Sine Modulation Wave) -->
  <path d="M 42 100 
           C 45 75, 70 45, 100 45 
           C 130 45, 155 70, 158 100 
           C 155 130, 130 155, 100 155 
           C 70 155, 45 125, 42 100"
        fill="none" stroke="url(#ringGrad2)" stroke-width="3" opacity="0.9" filter="url(#neonGlow)" />

  <!-- Inner Swirling Luminous Filaments -->
  <path d="M 48 95
           Q 65 65, 100 52
           Q 135 65, 152 95
           Q 140 135, 100 148
           Q 60 135, 48 95"
        fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.85" filter="url(#neonGlow)" />

  <path d="M 52 105
           Q 65 140, 100 146
           Q 138 140, 148 105
           Q 135 60, 100 54
           Q 65 60, 52 105"
        fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.85" filter="url(#neonGlow)" />

  <path d="M 45 100
           C 50 120, 80 152, 110 150
           C 140 148, 155 120, 155 100
           C 150 75, 120 48, 90 50
           C 60 52, 45 80, 45 100"
        fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.8" />

  <!-- Bright Pure White Center Core Ring Highlights -->
  <circle cx="100" cy="100" r="59" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85" />
</svg>
