<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6e0fe"/>
      <stop offset="50%" stop-color="#9acffb"/>
      <stop offset="100%" stop-color="#7ebff8"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="penShadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Dark Rounded Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="#334155" filter="url(#cardShadow)"/>
  
  <!-- Sky Blue Rounded Card -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="url(#cardGrad)"/>

  <!-- Subtle Paper Texture / Inner Border Glow -->
  <rect x="40" y="40" width="432" height="432" rx="86" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Handwritten Ink Curves (Dark Charcoal) -->
  <g stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Handwriting Stroke -->
    <path d="M 180 155 Q 200 105, 230 115 T 280 140 T 330 135 T 430 120" />
    
    <!-- Bottom Handwriting Stroke -->
    <path d="M 180 230 Q 205 185, 235 195 T 285 220 T 340 215 T 435 200" />
  </g>

  <!-- Digital Stylus Pen (White with black grip button) -->
  <g filter="url(#penShadow)">
    <!-- Pen Nib Cone -->
    <path d="M 108 100 L 118 135 L 98 135 Z" fill="#e2e8f0"/>
    <path d="M 108 100 L 112 115 L 104 115 Z" fill="#94a3b8"/>
    
    <!-- Pen Taper Collar -->
    <path d="M 98 135 L 118 135 L 122 170 L 94 170 Z" fill="#f1f5f9"/>

    <!-- Pen Shaft / Body -->
    <rect x="92" y="170" width="32" height="305" rx="16" fill="url(#penGrad)"/>

    <!-- Stylus Side Black Pill Button -->
    <rect x="100" y="228" width="16" height="96" rx="8" fill="#1e293b"/>
    <rect x="102" y="232" width="12" height="88" rx="6" fill="#0f172a"/>
    <rect x="103" y="236" width="4" height="40" rx="2" fill="#475569" opacity="0.6"/>
  </g>
</svg>
